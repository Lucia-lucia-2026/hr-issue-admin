<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HR 이슈 트래커</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f8fafc;}
    input,select,textarea{font-family:inherit;}
    button{font-family:inherit;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

/* ── 상수 ──────────────────────────────────────────── */
const EMP_TYPES = ["정규직","계약직","인턴"];
const PALETTE   = ["#3b82f6","#ef4444","#10b981","#f59e0b","#8b5cf6","#dc2626","#06b6d4","#ec4899","#f97316","#84cc16","#14b8a6","#6b7280"];
const API_KEY   = "hr_gas_url";

const D_TEAMS   = [{id:"t1",name:"경영지원팀"},{id:"t2",name:"마케팅팀"},{id:"t3",name:"MD팀"},{id:"t4",name:"운영팀"},{id:"t5",name:"고객서비스팀"}];
const D_MEMBERS = [
  {id:"m1",teamId:"t1",name:"홍길동",type:"정규직"},{id:"m2",teamId:"t1",name:"김영희",type:"정규직"},
  {id:"m3",teamId:"t2",name:"이철수",type:"정규직"},{id:"m4",teamId:"t2",name:"박지영",type:"인턴"},
  {id:"m5",teamId:"t3",name:"최민수",type:"정규직"},{id:"m6",teamId:"t3",name:"정수진",type:"계약직"},
  {id:"m7",teamId:"t4",name:"강현우",type:"정규직"},{id:"m8",teamId:"t5",name:"윤지현",type:"정규직"},
];
const D_CATS = [
  {id:"c1",name:"휴가/휴직",color:"#3b82f6"},{id:"c2",name:"성과 이슈",color:"#ef4444"},
  {id:"c3",name:"온보딩",color:"#10b981"},{id:"c4",name:"계약/퇴직",color:"#f59e0b"},
  {id:"c5",name:"면담/상담",color:"#8b5cf6"},{id:"c6",name:"징계",color:"#dc2626"},
  {id:"c7",name:"기타",color:"#6b7280"},
];

/* ── 유틸 ──────────────────────────────────────────── */
const uid     = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today   = () => new Date().toISOString().slice(0,10);
const fmtMD   = d => { const[,m,day]=d.split("-"); return `${m}/${day}`; };
const getDates= n => { const a=[]; for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10));} return a; };

/* ── 로컬캐시 (오프라인 폴백용) ─────────────────────── */
const cache = {
  get: k => { try{const v=localStorage.getItem("hrc_"+k);return v?JSON.parse(v):null;}catch{return null;} },
  set: (k,v)=> { try{localStorage.setItem("hrc_"+k,JSON.stringify(v));}catch{} },
};

/* ── GAS API ────────────────────────────────────────── */
async function gasLoad(url){
  const r = await fetch(url+"?action=getData",{redirect:"follow"});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||"API 오류");
  return j.data;
}
function gasSave(url,key,value){
  // FormData + no-cors: GAS의 e.parameter 로 수신되는 가장 안정적인 방식
  var fd = new FormData();
  fd.append("key", key);
  fd.append("value", JSON.stringify(value));
  fetch(url, {method:"POST", mode:"no-cors", body:fd});
}

/* ── Badge ──────────────────────────────────────────── */
function Badge({type}){
  const s=type==="정규직"?{bg:"#dbeafe",co:"#1d4ed8"}:type==="인턴"?{bg:"#d1fae5",co:"#065f46"}:{bg:"#ffedd5",co:"#c2410c"};
  return <span style={{fontSize:11,padding:"2px 6px",borderRadius:9999,fontWeight:600,background:s.bg,color:s.co}}>{type}</span>;
}

/* ══════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════ */
function App(){
  const [apiUrl,setApiUrl]   = useState(()=>localStorage.getItem(API_KEY)||"");
  const [setupInput,setSI]   = useState("");
  const [showSetup,setSetup] = useState(!localStorage.getItem(API_KEY));
  const [tab,setTab]         = useState("dashboard");
  const [teams,setTeams]     = useState(D_TEAMS);
  const [members,setMembers] = useState(D_MEMBERS);
  const [cats,setCats]       = useState(D_CATS);
  const [issues,setIssues]   = useState([]);
  const [loading,setLoading] = useState(true);
  const [sync,setSync]       = useState("idle"); // idle|loading|saving|saved|error
  const [lastSync,setLS]     = useState(null);
  const [toast,setToast]     = useState(null);

  const showToast=(msg,type="info")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  /* 데이터 로드 */
  const loadData = useCallback(async(url,quiet=false)=>{
    if(!url)return;
    if(!quiet)setSync("loading");
    try{
      const d=await gasLoad(url);
      if(d.teams)   setTeams(d.teams);   else if(!cache.get("teams"))   setTeams(D_TEAMS);
      if(d.members) setMembers(d.members); else if(!cache.get("members")) setMembers(D_MEMBERS);
      if(d.cats)    setCats(d.cats);      else if(!cache.get("cats"))    setCats(D_CATS);
      if(d.issues)  setIssues(d.issues);  else setIssues([]);
      setSync("saved"); setLS(new Date());
      if(!quiet)showToast("데이터를 불러왔습니다","ok");
    }catch(e){
      setSync("error");
      showToast("API 연결 실패 — 캐시 데이터를 표시합니다","err");
      const t=cache.get("teams"),m=cache.get("members"),c=cache.get("cats"),i=cache.get("issues");
      if(t)setTeams(t); if(m)setMembers(m); if(c)setCats(c); if(i)setIssues(i);
    }finally{ setLoading(false); }
  },[]);

  /* 초기 로드 */
  useEffect(()=>{
    if(apiUrl){ loadData(apiUrl); }
    else{
      const t=cache.get("teams"),m=cache.get("members"),c=cache.get("cats"),i=cache.get("issues");
      if(t)setTeams(t); if(m)setMembers(m); if(c)setCats(c); if(i)setIssues(i);
      setLoading(false);
    }
  },[apiUrl]);

  /* 자동 갱신 1분 */
  useEffect(()=>{
    if(!apiUrl)return;
    const id=setInterval(()=>loadData(apiUrl,true),60000);
    return()=>clearInterval(id);
  },[apiUrl,loadData]);

  /* 저장 */
  const sv=(key,data)=>{
    cache.set(key,data);
    if(!apiUrl)return;
    setSync("saving");
    gasSave(apiUrl,key,data); // fire-and-forget (no-cors는 응답을 읽지 않음)
    setTimeout(()=>{setSync("saved");setLS(new Date());},800);
  };
  const upT=d=>{setTeams(d);   sv("teams",d);};
  const upM=d=>{setMembers(d); sv("members",d);};
  const upC=d=>{setCats(d);    sv("cats",d);};
  const upI=d=>{setIssues(d);  sv("issues",d);};

  /* 설정 저장 */
  const handleSetup=()=>{
    const u=setupInput.trim();
    if(!u.startsWith("https://script.google.com")){showToast("올바른 GAS URL을 입력해주세요","err");return;}
    localStorage.setItem(API_KEY,u); setApiUrl(u); setSetup(false); loadData(u);
  };
  const resetUrl=()=>{localStorage.removeItem(API_KEY);setApiUrl("");setSetup(true);setSI("");};

  const syncC={idle:"#94a3b8",loading:"#3b82f6",saving:"#f59e0b",saved:"#10b981",error:"#ef4444"};
  const syncL={idle:"",loading:"불러오는 중…",saving:"저장 중…",saved:"✓ 저장됨",error:"⚠ 오류"};
  const tabs=[{id:"dashboard",l:"📊 대시보드"},{id:"issues",l:"📝 이슈 기록"},{id:"members",l:"👥 팀원 관리"},{id:"cats",l:"🏷️ 카테고리"}];
  const p={teams,members,cats,issues,upT,upM,upC,upI};

  if(loading) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:12,color:"#94a3b8"}}>
      <div style={{fontSize:32}}>🏷️</div>
      <p style={{fontSize:14,margin:0}}>데이터를 불러오는 중…</p>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#f8fafc"}}>

      {/* ── 설정 모달 ── */}
      {showSetup&&(
        <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.55)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#fff",borderRadius:16,padding:32,maxWidth:460,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,.25)"}}>
            <div style={{fontSize:36,textAlign:"center",marginBottom:8}}>🔗</div>
            <h2 style={{margin:"0 0 6px",fontSize:18,fontWeight:700,color:"#1e293b",textAlign:"center"}}>Google Sheets 연결</h2>
            <p style={{margin:"0 0 20px",fontSize:13,color:"#64748b",textAlign:"center",lineHeight:1.7}}>
              Apps Script 배포 후 받은 <b>웹 앱 URL</b>을 붙여넣으세요.<br/>
              팀원 전원이 같은 데이터를 실시간 공유합니다.
            </p>
            <input value={setupInput} onChange={e=>setSI(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSetup()}
              placeholder="https://script.google.com/macros/s/.../exec"
              style={{width:"100%",border:"1.5px solid #e2e8f0",borderRadius:8,padding:"10px 12px",fontSize:13,outline:"none",marginBottom:10}}/>
            <button onClick={handleSetup}
              style={{width:"100%",padding:"11px 0",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:8}}>
              연결하기
            </button>
            {apiUrl&&<button onClick={()=>setSetup(false)} style={{width:"100%",padding:"9px 0",background:"#f8fafc",color:"#475569",border:"1px solid #e2e8f0",borderRadius:8,fontSize:13,cursor:"pointer",marginBottom:8}}>취소</button>}
            <button onClick={()=>setSetup(false)} style={{width:"100%",padding:"7px 0",background:"none",border:"none",color:"#94a3b8",fontSize:12,cursor:"pointer"}}>
              나중에 설정 (로컬 모드로 시작)
            </button>
          </div>
        </div>
      )}

      {/* ── 토스트 ── */}
      {toast&&(
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:300,
          background:toast.type==="err"?"#fee2e2":toast.type==="ok"?"#dcfce7":"#f1f5f9",
          color:toast.type==="err"?"#dc2626":toast.type==="ok"?"#16a34a":"#475569",
          border:`1px solid ${toast.type==="err"?"#fca5a5":toast.type==="ok"?"#86efac":"#e2e8f0"}`,
          borderRadius:10,padding:"10px 20px",fontSize:13,fontWeight:500,boxShadow:"0 4px 16px rgba(0,0,0,.1)",whiteSpace:"nowrap"}}>
          {toast.msg}
        </div>
      )}

      {/* ── 헤더 ── */}
      <header style={{background:"#fff",borderBottom:"1px solid #e2e8f0",position:"sticky",top:0,zIndex:20,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
        <div style={{maxWidth:1100,margin:"0 auto",padding:"10px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
            <span style={{fontSize:20}}>🏷️</span>
            <span style={{fontWeight:700,color:"#1e293b",fontSize:15}}>HR 이슈 트래커</span>
          </div>
          <nav style={{display:"flex",gap:2,flex:1,flexWrap:"wrap"}}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"6px 12px",borderRadius:8,fontSize:13,fontWeight:500,border:"none",cursor:"pointer",transition:"all .15s",
                background:tab===t.id?"#2563eb":"transparent",color:tab===t.id?"#fff":"#475569"}}>{t.l}</button>
            ))}
          </nav>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <span style={{fontSize:11,color:syncC[sync],fontWeight:500}}>{syncL[sync]}</span>
            {lastSync&&<span style={{fontSize:10,color:"#94a3b8"}}>{lastSync.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</span>}
            <button onClick={()=>loadData(apiUrl)} title="새로고침" style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 9px",cursor:"pointer",fontSize:13}}>🔄</button>
            <button onClick={()=>{setSI(apiUrl);setSetup(true);}} title="API 설정" style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 9px",cursor:"pointer",fontSize:13}}>⚙️</button>
          </div>
        </div>
        {/* API 미연결 배너 */}
        {!apiUrl&&(
          <div style={{background:"#fef9c3",borderTop:"1px solid #fde68a",padding:"6px 16px",textAlign:"center",fontSize:12,color:"#92400e"}}>
            ⚠️ API 미연결 상태입니다. 데이터가 이 브라우저에만 저장됩니다.
            <button onClick={()=>{setSI("");setSetup(true);}} style={{marginLeft:10,color:"#1d4ed8",background:"none",border:"none",cursor:"pointer",fontSize:12,fontWeight:600,textDecoration:"underline"}}>지금 연결하기</button>
          </div>
        )}
      </header>

      <main style={{maxWidth:1100,margin:"0 auto",padding:"24px 16px"}}>
        {tab==="dashboard"&&<Dashboard {...p}/>}
        {tab==="issues"&&<IssueMgr {...p}/>}
        {tab==="members"&&<MemberMgr {...p}/>}
        {tab==="cats"&&<CatMgr {...p}/>}
      </main>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════════ */
function Dashboard({teams,members,cats,issues}){
  const [days,setDays]=useState(14);
  const [sel,setSel]=useState(null);
  const dr=getDates(days), tod=today(), thisMonth=tod.slice(0,7);
  const monthIss=issues.filter(i=>i.date.startsWith(thisMonth));
  const withIss=new Set(monthIss.map(i=>i.memberId)).size;
  const getIss=(mId,d)=>issues.filter(i=>i.memberId===mId&&i.date===d);
  const getCat=id=>cats.find(c=>c.id===id);
  const getM=id=>members.find(m=>m.id===id);
  const getT=id=>teams.find(t=>t.id===id);
  const stats=[{l:"이번 달 이슈",v:monthIss.length,c:"#2563eb"},{l:"이슈 팀원 수",v:withIss,c:"#7c3aed"},{l:"전체 팀원",v:members.length,c:"#059669"},{l:"누적 이슈",v:issues.length,c:"#d97706"}];
  const selIss=sel?getIss(sel.mId,sel.d):null, selM=sel?getM(sel.mId):null;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        {stats.map((s,i)=>(
          <div key={i} style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",padding:16,boxShadow:"0 1px 2px rgba(0,0,0,.04)"}}>
            <p style={{fontSize:12,color:"#94a3b8",margin:"0 0 4px"}}>{s.l}</p>
            <p style={{fontSize:28,fontWeight:700,color:s.c,margin:0}}>{s.v}</p>
          </div>
        ))}
      </div>

      <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",padding:16,boxShadow:"0 1px 2px rgba(0,0,0,.04)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <span style={{fontWeight:600,color:"#1e293b"}}>📅 날짜별 HR 이슈 현황판</span>
          <select value={days} onChange={e=>setDays(+e.target.value)} style={{fontSize:13,border:"1px solid #e2e8f0",borderRadius:8,padding:"4px 8px",color:"#475569",background:"#fff"}}>
            <option value={7}>최근 7일</option><option value={14}>최근 14일</option><option value={30}>최근 30일</option>
          </select>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{fontSize:12,width:"100%",borderCollapse:"collapse",minWidth:480}}>
            <thead>
              <tr style={{borderBottom:"1px solid #e2e8f0"}}>
                <th style={{textAlign:"left",padding:"6px 10px 6px 0",fontWeight:500,color:"#94a3b8",width:160,whiteSpace:"nowrap"}}>팀 · 팀원</th>
                {dr.map(d=>(
                  <th key={d} style={{textAlign:"center",padding:"4px 2px",fontWeight:500,color:d===tod?"#2563eb":"#94a3b8",minWidth:28}}>
                    <div>{fmtMD(d)}</div>{d===tod&&<div style={{fontSize:8,color:"#93c5fd"}}>●</div>}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {teams.map(team=>{
                const tm=members.filter(m=>m.teamId===team.id);
                if(!tm.length)return null;
                return[
                  <tr key={"h"+team.id}><td colSpan={dr.length+1} style={{paddingTop:12,paddingBottom:2}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".06em"}}>{team.name}</span>
                  </td></tr>,
                  ...tm.map(m=>(
                    <tr key={m.id} style={{borderBottom:"1px solid #f8fafc"}}>
                      <td style={{padding:"5px 10px 5px 0",whiteSpace:"nowrap"}}>
                        <span style={{fontWeight:500,color:"#1e293b",marginRight:4}}>{m.name}</span><Badge type={m.type}/>
                      </td>
                      {dr.map(d=>{
                        const di=getIss(m.id,d);
                        return(
                          <td key={d} style={{textAlign:"center",padding:"3px 2px",background:d===tod?"#eff6ff":"transparent"}}>
                            {di.length>0?(
                              <button onClick={()=>setSel(s=>s?.mId===m.id&&s?.d===d?null:{mId:m.id,d})}
                                style={{background:"none",border:"none",cursor:"pointer",padding:0,display:"flex",flexWrap:"wrap",gap:2,justifyContent:"center",margin:"0 auto",width:20}}>
                                {di.map(iss=><div key={iss.id} style={{width:10,height:10,borderRadius:"50%",background:getCat(iss.categoryId)?.color||"#9ca3af"}} title={getCat(iss.categoryId)?.name}/>)}
                              </button>
                            ):(
                              <div style={{width:10,height:10,borderRadius:"50%",background:"#f1f5f9",margin:"0 auto"}}/>
                            )}
                          </td>
                        );
                      })}
                    </tr>
                  ))
                ];
              })}
            </tbody>
          </table>
        </div>
        {selIss&&selM&&(
          <div style={{marginTop:12,borderTop:"1px solid #e2e8f0",paddingTop:12}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>
                {sel.d} · {selM.name} <Badge type={selM.type}/> <span style={{color:"#94a3b8",fontWeight:400,fontSize:12}}>{getT(selM.teamId)?.name}</span>
              </span>
              <button onClick={()=>setSel(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#cbd5e1",lineHeight:1}}>×</button>
            </div>
            {selIss.map(iss=>{const cat=getCat(iss.categoryId);return(
              <div key={iss.id} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:6,fontSize:13}}>
                <span style={{padding:"2px 10px",borderRadius:9999,color:"#fff",fontSize:12,flexShrink:0,background:cat?.color||"#9ca3af"}}>{cat?.name}</span>
                {iss.memo&&<span style={{color:"#475569"}}>{iss.memo}</span>}
              </div>
            );})}
          </div>
        )}
        <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid #e2e8f0",display:"flex",flexWrap:"wrap",gap:12}}>
          {cats.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#64748b"}}><div style={{width:10,height:10,borderRadius:"50%",background:c.color}}/>{c.name}</div>)}
        </div>
      </div>

      <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",padding:16,boxShadow:"0 1px 2px rgba(0,0,0,.04)"}}>
        <p style={{fontWeight:600,color:"#1e293b",margin:"0 0 12px"}}>🕐 최근 이슈</p>
        {issues.length===0?(<p style={{color:"#94a3b8",textAlign:"center",padding:"24px 0",fontSize:13,margin:0}}>기록된 이슈가 없습니다.</p>):(
          <div>{[...issues].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(iss=>{
            const m=getM(iss.memberId),cat=getCat(iss.categoryId),team=getT(m?.teamId);
            return(
              <div key={iss.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f8fafc",fontSize:13}}>
                <span style={{color:"#94a3b8",fontSize:11,width:44,flexShrink:0}}>{iss.date.slice(5)}</span>
                <span style={{color:"#94a3b8",fontSize:11,width:70,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{team?.name}</span>
                <span style={{fontWeight:500,color:"#1e293b",width:56,flexShrink:0}}>{m?.name}</span>
                <span style={{padding:"2px 8px",borderRadius:9999,color:"#fff",fontSize:11,flexShrink:0,background:cat?.color||"#9ca3af"}}>{cat?.name}</span>
                {iss.memo&&<span style={{color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12}}>{iss.memo}</span>}
              </div>
            );
          })}</div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   ISSUE MANAGER
══════════════════════════════════════════════════════ */
function IssueMgr({teams,members,cats,issues,upI}){
  const [showForm,setSF]=useState(false);
  const [editing,setEd]=useState(null);
  const [form,setForm]=useState({teamId:"",memberId:"",categoryId:"",date:today(),memo:""});
  const [fTeam,setFT]=useState(""); const [fMem,setFM]=useState("");
  const [fCat,setFC]=useState(""); const [fFrom,setFF]=useState(""); const [fTo,setFTo]=useState("");

  const openAdd=()=>{setEd(null);setForm({teamId:"",memberId:"",categoryId:"",date:today(),memo:""});setSF(true);};
  const startEdit=iss=>{const m=members.find(x=>x.id===iss.memberId);setEd(iss.id);setForm({teamId:m?.teamId||"",memberId:iss.memberId,categoryId:iss.categoryId,date:iss.date,memo:iss.memo||""});setSF(true);};
  const save=()=>{
    if(!form.memberId||!form.categoryId||!form.date)return;
    const{teamId,...rest}=form;
    if(editing){upI(issues.map(i=>i.id===editing?{...i,...rest}:i));}
    else{upI([...issues,{id:uid(),...rest}]);}
    setSF(false);setEd(null);
  };
  const del=id=>{if(confirm("이슈를 삭제하시겠습니까?"))upI(issues.filter(i=>i.id!==id));};

  const filtered=issues.filter(i=>{
    const m=members.find(x=>x.id===i.memberId);
    if(fTeam&&m?.teamId!==fTeam)return false;
    if(fMem&&i.memberId!==fMem)return false;
    if(fCat&&i.categoryId!==fCat)return false;
    if(fFrom&&i.date<fFrom)return false;
    if(fTo&&i.date>fTo)return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  const exportCSV=()=>{
    const rows=[["날짜","팀","이름","고용형태","카테고리","메모"],...filtered.map(i=>{
      const m=members.find(x=>x.id===i.memberId),t=teams.find(x=>x.id===m?.teamId),c=cats.find(x=>x.id===i.categoryId);
      return[i.date,t?.name||"",m?.name||"",m?.type||"",c?.name||"",i.memo||""];
    })];
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`hr_issues_${today()}.csv`;a.click();
  };

  const inp={fontSize:13,border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 12px",width:"100%",background:"#fff",color:"#1e293b",outline:"none"};
  const btn=(bg,fg,bo)=>({padding:"7px 16px",borderRadius:8,border:bo||"none",cursor:"pointer",fontSize:13,fontWeight:500,background:bg,color:fg});

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:18,fontWeight:600,color:"#1e293b"}}>📝 HR 이슈 기록</span>
        <div style={{display:"flex",gap:8}}>
          <button onClick={exportCSV} style={btn("#fff","#475569","1px solid #e2e8f0")}>📥 CSV 내보내기</button>
          <button onClick={openAdd} style={btn("#2563eb","#fff")}>+ 이슈 추가</button>
        </div>
      </div>

      {showForm&&(
        <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:16}}>
          <p style={{fontWeight:600,color:"#1e4ed8",fontSize:13,margin:"0 0 12px"}}>{editing?"이슈 수정":"새 이슈 기록"}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {[["팀 선택","",teams.map(t=>({v:t.id,l:t.name})),"전체 팀",v=>setForm({...form,teamId:v,memberId:""}),form.teamId],
              ["팀원 *","",members.filter(m=>!form.teamId||m.teamId===form.teamId).map(m=>({v:m.id,l:`${m.name} (${m.type})`})),"선택",v=>setForm({...form,memberId:v}),form.memberId],
              ["카테고리 *","",cats.map(c=>({v:c.id,l:c.name})),"선택",v=>setForm({...form,categoryId:v}),form.categoryId],
            ].map(([lbl,,opts,ph,fn,val],i)=>(
              <div key={i}>
                <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>{lbl}</label>
                <select value={val} onChange={e=>fn(e.target.value)} style={inp}>
                  <option value="">{ph}</option>
                  {opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
                </select>
              </div>
            ))}
            <div>
              <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>날짜 *</label>
              <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} style={inp}/>
            </div>
            <div style={{gridColumn:"1/-1"}}>
              <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>메모</label>
              <textarea value={form.memo} onChange={e=>setForm({...form,memo:e.target.value})} rows={2}
                placeholder="이슈 내용을 기록하세요…" style={{...inp,resize:"none"}}/>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button onClick={save} style={btn("#2563eb","#fff")}>{editing?"수정 완료":"저장"}</button>
            <button onClick={()=>{setSF(false);setEd(null);}} style={btn("#fff","#475569","1px solid #e2e8f0")}>취소</button>
          </div>
        </div>
      )}

      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:"10px 14px",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:"#94a3b8",fontWeight:600}}>필터</span>
        <select value={fTeam} onChange={e=>{setFT(e.target.value);setFM("");}} style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:8,padding:"4px 8px",color:"#475569",background:"#fff"}}>
          <option value="">전체 팀</option>{teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <select value={fMem} onChange={e=>setFM(e.target.value)} style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:8,padding:"4px 8px",color:"#475569",background:"#fff"}}>
          <option value="">전체 팀원</option>{members.filter(m=>!fTeam||m.teamId===fTeam).map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
        <select value={fCat} onChange={e=>setFC(e.target.value)} style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:8,padding:"4px 8px",color:"#475569",background:"#fff"}}>
          <option value="">전체 카테고리</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <input type="date" value={fFrom} onChange={e=>setFF(e.target.value)} style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:8,padding:"4px 8px",color:"#475569",background:"#fff"}}/>
        <span style={{color:"#cbd5e1",fontSize:11}}>~</span>
        <input type="date" value={fTo} onChange={e=>setFTo(e.target.value)} style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:8,padding:"4px 8px",color:"#475569",background:"#fff"}}/>
        {(fTeam||fMem||fCat||fFrom||fTo)&&<button onClick={()=>{setFT("");setFM("");setFC("");setFF("");setFTo("");}} style={{fontSize:12,color:"#2563eb",background:"none",border:"none",cursor:"pointer",padding:0}}>초기화</button>}
        <span style={{fontSize:11,color:"#94a3b8",marginLeft:4}}>{filtered.length}건</span>
      </div>

      <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",boxShadow:"0 1px 2px rgba(0,0,0,.04)",overflow:"hidden"}}>
        {filtered.length===0?(<p style={{textAlign:"center",color:"#94a3b8",padding:"48px 0",fontSize:13,margin:0}}>기록된 이슈가 없습니다.</p>):(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead style={{background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
                <tr>{["날짜","팀","팀원","카테고리","메모",""].map((h,i)=>(
                  <th key={i} style={{textAlign:"left",padding:"10px 14px",fontWeight:500,color:"#64748b",fontSize:11}}>{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {filtered.map((iss,idx)=>{
                  const m=members.find(x=>x.id===iss.memberId),t=teams.find(x=>x.id===m?.teamId),c=cats.find(x=>x.id===iss.categoryId);
                  return(
                    <tr key={iss.id} style={{borderBottom:"1px solid #f8fafc",background:idx%2===0?"#fff":"#fafafa"}}>
                      <td style={{padding:"9px 14px",color:"#64748b",whiteSpace:"nowrap",fontSize:12}}>{iss.date}</td>
                      <td style={{padding:"9px 14px",color:"#94a3b8",fontSize:12}}>{t?.name}</td>
                      <td style={{padding:"9px 14px",whiteSpace:"nowrap"}}><span style={{fontWeight:500,color:"#1e293b",marginRight:4}}>{m?.name}</span>{m&&<Badge type={m.type}/>}</td>
                      <td style={{padding:"9px 14px"}}><span style={{padding:"2px 10px",borderRadius:9999,color:"#fff",fontSize:11,background:c?.color||"#9ca3af"}}>{c?.name}</span></td>
                      <td style={{padding:"9px 14px",color:"#64748b",fontSize:12,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{iss.memo}</td>
                      <td style={{padding:"9px 14px",whiteSpace:"nowrap"}}>
                        <button onClick={()=>startEdit(iss)} style={{fontSize:12,color:"#2563eb",background:"none",border:"none",cursor:"pointer",marginRight:8}}>수정</button>
                        <button onClick={()=>del(iss.id)} style={{fontSize:12,color:"#ef4444",background:"none",border:"none",cursor:"pointer"}}>삭제</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   MEMBER MANAGER
══════════════════════════════════════════════════════ */
function MemberMgr({teams,members,upT,upM}){
  const [etId,setET]=useState(null); const [etName,setEN]=useState("");
  const [addT,setAT]=useState(false); const [newTN,setNT]=useState("");
  const [addMT,setAMT]=useState(null); const [edMId,setEMI]=useState(null);
  const [mf,setMF]=useState({name:"",type:"정규직"});

  const addTeam=()=>{if(!newTN.trim())return;upT([...teams,{id:uid(),name:newTN.trim()}]);setNT("");setAT(false);};
  const saveTeam=id=>{upT(teams.map(t=>t.id===id?{...t,name:etName}:t));setET(null);};
  const delTeam=id=>{if(!confirm("팀을 삭제하면 해당 팀원도 삭제됩니다. 계속하시겠습니까?"))return;upT(teams.filter(t=>t.id!==id));upM(members.filter(m=>m.teamId!==id));};
  const saveMember=()=>{
    if(!mf.name.trim())return;
    if(edMId){upM(members.map(m=>m.id===edMId?{...m,...mf}:m));setEMI(null);}
    else if(addMT){upM([...members,{id:uid(),teamId:addMT,name:mf.name.trim(),type:mf.type}]);setAMT(null);}
    setMF({name:"",type:"정규직"});
  };
  const delM=id=>{if(confirm("팀원을 삭제하시겠습니까?"))upM(members.filter(m=>m.id!==id));};
  const inp={fontSize:13,border:"1px solid #e2e8f0",borderRadius:8,padding:"6px 10px",background:"#fff",color:"#1e293b",outline:"none"};
  const btn=(bg,fg,bo)=>({padding:"6px 14px",borderRadius:8,border:bo||"none",cursor:"pointer",fontSize:13,fontWeight:500,background:bg,color:fg});

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:18,fontWeight:600,color:"#1e293b"}}>👥 팀원 관리</span>
        <button onClick={()=>{setAT(true);setNT("");}} style={btn("#2563eb","#fff")}>+ 팀 추가</button>
      </div>
      {addT&&(
        <div style={{display:"flex",gap:8,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:12}}>
          <input autoFocus value={newTN} onChange={e=>setNT(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTeam()} placeholder="새 팀 이름" style={{...inp,flex:1}}/>
          <button onClick={addTeam} style={btn("#2563eb","#fff")}>추가</button>
          <button onClick={()=>setAT(false)} style={btn("#fff","#475569","1px solid #e2e8f0")}>취소</button>
        </div>
      )}
      {teams.map(team=>{
        const tm=members.filter(m=>m.teamId===team.id);
        return(
          <div key={team.id} style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",boxShadow:"0 1px 2px rgba(0,0,0,.04)",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 16px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              {etId===team.id?(
                <div style={{display:"flex",gap:8,flex:1}}>
                  <input autoFocus value={etName} onChange={e=>setEN(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveTeam(team.id)} onBlur={()=>saveTeam(team.id)} style={{...inp,maxWidth:240}}/>
                  <span style={{fontSize:11,color:"#94a3b8",alignSelf:"center"}}>Enter로 저장</span>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontWeight:600,color:"#1e293b"}}>{team.name}</span>
                  <span style={{fontSize:12,color:"#94a3b8"}}>({tm.length}명)</span>
                </div>
              )}
              <div style={{display:"flex",gap:12}}>
                <button onClick={()=>{setET(team.id);setEN(team.name);}} style={{fontSize:12,color:"#2563eb",background:"none",border:"none",cursor:"pointer"}}>팀명 수정</button>
                <button onClick={()=>{setAMT(team.id);setMF({name:"",type:"정규직"});setEMI(null);}} style={{fontSize:12,color:"#059669",background:"none",border:"none",cursor:"pointer"}}>+ 팀원 추가</button>
                <button onClick={()=>delTeam(team.id)} style={{fontSize:12,color:"#ef4444",background:"none",border:"none",cursor:"pointer"}}>팀 삭제</button>
              </div>
            </div>
            {addMT===team.id&&(
              <div style={{display:"flex",gap:8,padding:"8px 16px",background:"#f0fdf4",borderBottom:"1px solid #e2e8f0",alignItems:"center"}}>
                <input autoFocus value={mf.name} onChange={e=>setMF({...mf,name:e.target.value})} onKeyDown={e=>e.key==="Enter"&&saveMember()} placeholder="이름" style={{...inp,width:120}}/>
                <select value={mf.type} onChange={e=>setMF({...mf,type:e.target.value})} style={inp}>{EMP_TYPES.map(t=><option key={t}>{t}</option>)}</select>
                <button onClick={saveMember} style={btn("#059669","#fff")}>추가</button>
                <button onClick={()=>setAMT(null)} style={btn("#fff","#475569","1px solid #e2e8f0")}>취소</button>
              </div>
            )}
            {tm.length===0?(<p style={{textAlign:"center",color:"#94a3b8",padding:"14px 0",fontSize:13,margin:0}}>팀원이 없습니다.</p>):(
              tm.map((m,idx)=>(
                <div key={m.id} style={{display:"flex",alignItems:"center",padding:"9px 16px",borderBottom:idx<tm.length-1?"1px solid #f8fafc":"none"}}>
                  {edMId===m.id?(
                    <div style={{display:"flex",gap:8,flex:1,alignItems:"center"}}>
                      <input autoFocus value={mf.name} onChange={e=>setMF({...mf,name:e.target.value})} onKeyDown={e=>e.key==="Enter"&&saveMember()} style={{...inp,width:120}}/>
                      <select value={mf.type} onChange={e=>setMF({...mf,type:e.target.value})} style={inp}>{EMP_TYPES.map(t=><option key={t}>{t}</option>)}</select>
                      <button onClick={saveMember} style={{fontSize:12,color:"#2563eb",fontWeight:600,background:"none",border:"none",cursor:"pointer"}}>저장</button>
                      <button onClick={()=>setEMI(null)} style={{fontSize:12,color:"#94a3b8",background:"none",border:"none",cursor:"pointer"}}>취소</button>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>
                      <span style={{fontWeight:500,color:"#1e293b"}}>{m.name}</span><Badge type={m.type}/>
                    </div>
                  )}
                  {edMId!==m.id&&(
                    <div style={{display:"flex",gap:12}}>
                      <button onClick={()=>{setEMI(m.id);setMF({name:m.name,type:m.type});setAMT(null);}} style={{fontSize:12,color:"#2563eb",background:"none",border:"none",cursor:"pointer"}}>수정</button>
                      <button onClick={()=>delM(m.id)} style={{fontSize:12,color:"#ef4444",background:"none",border:"none",cursor:"pointer"}}>삭제</button>
                    </div>
                  )}
                </div>
              ))
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   CATEGORY MANAGER
══════════════════════════════════════════════════════ */
function CatMgr({cats,upC}){
  const [editing,setEd]=useState(null); const [adding,setAdd]=useState(false);
  const [form,setForm]=useState({name:"",color:"#3b82f6"});
  const openAdd=()=>{setAdd(true);setEd(null);setForm({name:"",color:"#3b82f6"});};
  const startEdit=c=>{setEd(c.id);setForm({name:c.name,color:c.color});setAdd(false);};
  const save=()=>{
    if(!form.name.trim())return;
    if(editing){upC(cats.map(c=>c.id===editing?{...c,...form}:c));setEd(null);}
    else{upC([...cats,{id:uid(),...form}]);setAdd(false);}
    setForm({name:"",color:"#3b82f6"});
  };
  const del=id=>{if(confirm("카테고리를 삭제하시겠습니까?"))upC(cats.filter(c=>c.id!==id));};
  const inp={fontSize:13,border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 12px",width:"100%",background:"#fff",color:"#1e293b",outline:"none"};
  return(
    <div style={{maxWidth:480,display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:18,fontWeight:600,color:"#1e293b"}}>🏷️ 카테고리 관리</span>
        <button onClick={openAdd} style={{padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontSize:13,fontWeight:500,background:"#2563eb",color:"#fff"}}>+ 카테고리 추가</button>
      </div>
      {(adding||editing)&&(
        <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:16,display:"flex",flexDirection:"column",gap:12}}>
          <p style={{fontWeight:600,color:"#1e4ed8",fontSize:13,margin:0}}>{editing?"카테고리 수정":"새 카테고리"}</p>
          <div>
            <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>이름</label>
            <input autoFocus value={form.name} onChange={e=>setForm({...form,name:e.target.value})} onKeyDown={e=>e.key==="Enter"&&save()} placeholder="카테고리 이름" style={inp}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:8}}>색상</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {PALETTE.map(c=>(
                <button key={c} onClick={()=>setForm({...form,color:c})}
                  style={{width:28,height:28,borderRadius:"50%",border:form.color===c?"3px solid #475569":"3px solid transparent",cursor:"pointer",background:c,transform:form.color===c?"scale(1.15)":"scale(1)",transition:"all .15s"}}/>
              ))}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:11,color:"#94a3b8"}}>미리보기</span>
            <span style={{padding:"4px 12px",borderRadius:9999,color:"#fff",fontSize:13,background:form.color}}>{form.name||"카테고리명"}</span>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={save} style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",fontSize:13,fontWeight:500,background:"#2563eb",color:"#fff"}}>저장</button>
            <button onClick={()=>{setAdd(false);setEd(null);}} style={{padding:"7px 16px",borderRadius:8,border:"1px solid #e2e8f0",cursor:"pointer",fontSize:13,background:"#fff",color:"#475569"}}>취소</button>
          </div>
        </div>
      )}
      <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",boxShadow:"0 1px 2px rgba(0,0,0,.04)",overflow:"hidden"}}>
        {cats.map((cat,i)=>(
          <div key={cat.id} style={{display:"flex",alignItems:"center",padding:"12px 16px",borderBottom:i<cats.length-1?"1px solid #f8fafc":"none"}}>
            <div style={{width:14,height:14,borderRadius:"50%",background:cat.color,marginRight:12,flexShrink:0}}/>
            <span style={{flex:1,color:"#1e293b",fontWeight:500}}>{cat.name}</span>
            <div style={{display:"flex",gap:12}}>
              <button onClick={()=>startEdit(cat)} style={{fontSize:12,color:"#2563eb",background:"none",border:"none",cursor:"pointer"}}>수정</button>
              <button onClick={()=>del(cat.id)} style={{fontSize:12,color:"#ef4444",background:"none",border:"none",cursor:"pointer"}}>삭제</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
